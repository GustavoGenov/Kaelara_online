# render.yaml
services:
  - type: web
    name: kaelara
    env: python
    buildCommand: pip install -r backend_requirements.txt
    startCommand: gunicorn kaelara.app:app
    plan: free
    region: oregon
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-1.5-flash
    # Render will automatically detect Dockerfile if present; this config uses it.
