<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f141a"/>
      <stop offset="50%" stop-color="#140d12"/>
      <stop offset="100%" stop-color="#0a0508"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow-arc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg-arc)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <g filter="url(#glow-arc)">
    <!-- Archangel Left Wing -->
    <path d="M29 34C22 33 14 26 13 14c4 4 9 7 16 8v12z" fill="url(#gold-grad)" fill-opacity="0.9"/>
    <path d="M28 40C20 39 15 33 15 23c3 3 7 5 13 6v11z" fill="url(#gold-grad)" fill-opacity="0.6"/>

    <!-- Archangel Right Wing -->
    <path d="M35 34C42 33 50 26 51 14c-4 4-9 7-16 8v12z" fill="url(#gold-grad)" fill-opacity="0.9"/>
    <path d="M36 40C44 39 49 33 49 23c-3 3-7 5-13 6v11z" fill="url(#gold-grad)" fill-opacity="0.6"/>

    <!-- Center Classical Feather Quill / Spire of Truth -->
    <path d="M32 9c-1.5 6-3 18-3 26 0 5 1.5 9 3 13 1.5-4 3-8 3-13 0-8-1.5-20-3-26z" fill="url(#gold-light)"/>
    <line x1="32" y1="9" x2="32" y2="48" stroke="#78350f" stroke-width="1.2"/>
    <circle cx="32" cy="52" r="2" fill="url(#gold-grad)"/>

    <!-- Top Halo / Wisdom Spark -->
    <circle cx="32" cy="11" r="1.5" fill="#ffffff"/>
    <path d="M32 6v2M32 14v2M27 11h2M35 11h2" stroke="url(#gold-light)" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
